    function translateSearchValue(type, value){

    const t = translations[siteLanguage];

    if(!t){
        return value;
    }

    if(type === "country"){
        return t.countryNames?.[value] || value;
    }

    if(type === "language"){
        return t.languageNames?.[value] || value;
    }

    if(type === "service"){
        return t.serviceNames?.[value] || value;
    }

    return value;
}

    let activePremiumCompanyIds = [];

async function initializeResults(){

    const publicData =
        await loadPublicData();

    activePremiumCompanyIds =
        publicData.activePremiumCompanyIds || [];

    const approvedCompanies =
        publicData.approvedCompanies || [];

    console.log(
        "Active Premium companies:",
        activePremiumCompanyIds
    );

    console.log(
        "Sheets approved companies:",
        approvedCompanies
    );

    const sheetCompanies = [];

approvedCompanies.forEach(company => {

    let languages = [];

    if(Array.isArray(company.languages)){

        languages = company.languages;

    } else if(company.languages){

        languages = String(company.languages)
            .split(",")
            .map(lang => lang.trim())
            .filter(Boolean);

    }

    if(company.otherLanguage){

        const otherLanguage =
            String(company.otherLanguage).trim();

        if(
            otherLanguage &&
            !languages.includes(otherLanguage)
        ){
            languages.push(otherLanguage);
        }

    }

    languages.forEach(languageName => {

        console.log(
    "Sheet language:",
    languageName
);

        sheetCompanies.push({

            companyId:
                company.companyId || "",

            id:
                (company.companyId || company.companyName)
                + "-"
                + languageName
                    .toLowerCase()
                    .replace(/\s+/g, "-"),

            name:
                company.companyName,

            language:
    String(languageName).trim(),

            service:
                company.service,

            country:
                company.country,

            city:
                company.city,

            address:
                company.address || "",

            description:
                company.description || "",

            website:
                company.website || "",

            phone:
                company.phone || "",

            instagram:
                company.instagram || "",

            facebook:
                company.facebook || "",

            lat:
                parseFloat(company.latitude),

            lng:
                parseFloat(company.longitude),

            premium:
                company.companyId
                    ? activePremiumCompanyIds.includes(
                        company.companyId
                    )
                    : false

        });

    });

});

console.log(

);

function updateVisibleResults(){

    const bounds = map.getBounds();

    let visibleCount = 0;

    document
        .querySelectorAll(".result-card")
        .forEach(card => {

            const lat = parseFloat(card.dataset.lat);
            const lng = parseFloat(card.dataset.lng);

            if(isNaN(lat) || isNaN(lng)){
                return;
            }

            if(bounds.contains([lat,lng])){

                card.style.display = "block";

                visibleCount++;

            } else {

                card.style.display = "none";

            }

        });

    document.getElementById("summary-count").textContent =
        visibleCount + " " + translations[siteLanguage].visibleOnMap;

}

.querySelectorAll(".show-map-btn")
.forEach(button => {

button.addEventListener("click", function(){

const lat = parseFloat(this.dataset.lat);
const lng = parseFloat(this.dataset.lng);
const companyId = this.dataset.companyId;
trackClick(companyId,'map_click');

if(!isNaN(lat) && !isNaN(lng)){

    map.setView([lat, lng], 15);

    markers.forEach(marker => {

        if(marker.companyId === companyId){
            marker.openPopup();
        }

    });

}

});

});

console.log(matchingServices);

const count = matchingServices.length;

if(count === 0){

const noResultsTitle =
translations[siteLanguage].noResultsTitle;

const noResultsText =
translations[siteLanguage].noResultsText;

const noResultsHelp =
translations[siteLanguage].noResultsHelp;

document.getElementById("dynamic-results").innerHTML = `
<div class="result-card" style="display:block;">
<h2>${noResultsTitle}</h2>
<p>${noResultsText}</p>
<p>${noResultsHelp}</p>
</div>
`;

}

document.getElementById("summary-count").textContent =
count + " " + translations[siteLanguage].found;

    L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

const markers = [];

matchingServices.forEach(item => {

console.log(
    item.name,
    item.lat,
    item.lng
);

const markerIcon = L.divIcon({

    className: "",

    html: item.premium
        ? `
        <div class="map-marker map-marker-premium">
            <div class="map-marker-inner">★</div>
        </div>
        `
        : `
        <div class="map-marker">
            <div class="map-marker-inner">●</div>
        </div>
        `,

    iconSize: item.premium ? [27,27] : [22,22],

iconAnchor: item.premium ? [14,27] : [11,22],

popupAnchor: [0,-24]

});


const marker =
L.marker(
    [item.lat, item.lng],
    {
        icon: markerIcon,
        zIndexOffset: item.premium ? 1000 : 0
    }
)
.addTo(map)
.bindPopup(
`
<div class="company-popup">

    <strong>
        ${item.premium ? '⭐ ' : ''}${item.name}
    </strong>

    <div class="popup-location">
        ${translations[siteLanguage].location}: 
        ${item.city}, ${item.country}
    </div>

    <div class="popup-address">
        ${translations[siteLanguage].address}: 
        ${item.address}
    </div>

    <button
        class="popup-company-btn"
        onclick="showCompanyFromMap('${item.id}')">
        ${translations[siteLanguage].showCompany}
    </button>

</div>
`
);

    marker.companyId = item.id;

    marker.on("click", function(){

    const card = document.querySelector(
        `.result-card[data-company-id="${item.id}"]`
    );

    if(!card){
        return;
    }

    document
        .querySelectorAll(".result-card")
        .forEach(c => {
            c.classList.remove("map-selected");
        });

    card.classList.add("map-selected");

if(window.innerWidth > 900){

    card.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}

});

markers.push(marker);

});

    document
.querySelectorAll(".result-card")
.forEach(card => {

    card.addEventListener("click", function(event){

        if(
            event.target.closest("button") ||
            event.target.closest("a")
        ){
            return;
        }

        const companyId = this.dataset.companyId;
        const lat = parseFloat(this.dataset.lat);
        const lng = parseFloat(this.dataset.lng);

        if(isNaN(lat) || isNaN(lng)){
            return;
        }

        document
        .querySelectorAll(".result-card")
        .forEach(c => {
            c.classList.remove("map-selected");
        });

        this.classList.add("map-selected");

        map.setView([lat, lng], 14);

        markers.forEach(marker => {

            if(marker.companyId === companyId){
                marker.openPopup();
            }

        });

    });

});

function showCompanyFromMap(companyId){

    const card = document.querySelector(
        `.result-card[data-company-id="${companyId}"]`
    );

    if(!card){
        return;
    }

    document
        .querySelectorAll(".result-card")
        .forEach(c => {
            c.classList.remove("map-selected");
        });

    card.classList.add("map-selected");

    card.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

const group = L.featureGroup(markers);

if(markers.length > 0){

    map.fitBounds(group.getBounds(), {
        padding:[100,100]
    });

    updateVisibleResults();

    map.on("moveend", updateVisibleResults);

}
    
document
.getElementById('show-all')
.addEventListener('click', function(){

    if(markers.length > 0){

        map.fitBounds(group.getBounds(), {
            padding:[100,100]
        });

    }

});


    function trackClick(companyId, eventType){

fetch("https://script.google.com/macros/s/AKfycbwL9rUFjX_pQe5PAk3LrWjE8QyOSG68Z1cuCmv0zLk7d6zyWB7LwIt287BLzT_AvLwEMQ/exec", {

    method: "POST",

    body: JSON.stringify({
        action: "trackClick",
        companyId: companyId,
        event: eventType
    })

})
.then(response => response.text())
.then(data => console.log("Tracked:", data))
.catch(error => console.log(error));

}

    }

initializeResults();
