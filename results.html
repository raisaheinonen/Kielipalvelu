<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakutulokset</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.container{
    display:flex;
    min-height:calc(100vh - 68px);
}

.results{
    width:40%;
    padding:20px;
    background:#f4f7fb;
    overflow-y:auto;
}

.result-card{
    display:none;
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.premium{
    border:3px solid gold;
    background:#fffdf2;
}

.topbar{
    background:#005bbb;
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.show-map-btn{
    background:#005bbb;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    margin-top:10px;
}

.show-map-btn:hover{
    background:#004799;
}
    
.map{
    width:60%;
    border-left:1px solid #ddd;
    position:sticky;
    top:0;
    height:calc(100vh - 68px);
}


#map{
    width:100%;
    height:calc(100vh - 68px);
}

</style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
</head>

<body>

<div class="topbar">
    <a href="index.html" style="color:white;text-decoration:none;">
        🌍 Kielipalvelu
    </a>
</div>
    
<div class="container">

<div class="results">

<h2>Hakutulokset</h2>

<div id="dynamic-results"></div>

<button class="show-map-btn" id="show-all">
Näytä kaikki kartalla
</button>

<p>
<strong id="search-info"></strong>
</p>

<p id="result-count"></p>


</div>

<div class="map">
    
<div id="map"></div>
    
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([36.65, -4.65], 8);

const params = new URLSearchParams(window.location.search);

const language = params.get('language');
const service = params.get('service');
const country = params.get('country');

const services = [

{
    id:"malaga",
    name:"Suomalainen Hammaslääkäri Malaga",
    language:"Suomi",
    service:"Hammaslääkäri",
    country:"Espanja",
    city:"Malaga",
    address:"Calle Larios 15",
    phone:"+34 123 456 789",
    website:"www.hammaslaakari-malaga.com",
    premium:true,
    lat:36.7213,
    lng:-4.4214
},

{
    id:"fuengirola",
    name:"Nordic Dentist Fuengirola",
    language:"Suomi",
    service:"Hammaslääkäri",
    country:"Espanja",
    city:"Fuengirola",
    address:"Paseo Marítimo Rey de España 55",
    premium:false,
    lat:36.5390,
    lng:-4.6247
},

{
    id:"marbella",
    name:"Ruotsalainen Lakipalvelu Marbella",
    language:"Ruotsi",
    service:"Lakimies",
    country:"Espanja",
    city:"Marbella",
    address:"Avenida Ricardo Soriano 12",
    premium:false,
    lat:36.5101,
    lng:-4.8856
},

{
    id:"alicante",
    name:"English Doctor Alicante",
    language:"Englanti",
    service:"Lääkäri",
    country:"Espanja",
    city:"Alicante",
    address:"Avenida Alfonso X El Sabio 25",
    premium:false,
    lat:38.3452,
    lng:-0.4810
},
    
{
    id:"torremolinos",
    name:"Suomalainen Fysioterapeutti Torremolinos",
    language:"Suomi",
    service:"Lääkäri",
    country:"Espanja",
    city:"Torremolinos",
    address:"Calle San Miguel 10",
    premium:false,
    lat:36.6218,
    lng:-4.4998
}

];

console.log(services);
console.log(services.length);
    
console.log(language);
console.log(service);
console.log(country);

const matchingServices = services.filter(item =>

item.language === language &&
item.service === service &&
item.country === country

);

let html = "";

matchingServices.forEach(item => {

html += `
<div class="result-card ${item.premium ? 'premium' : ''}" style="display:block;">

<h2>
${item.premium ? "⭐ PREMIUM<br>" : ""}
${item.name}
</h2>


<p>📍 ${item.city}, ${item.country}</p>

<p>🏢 ${item.address}</p>

${item.premium ? `
<p>📞 ${item.phone}</p>
<p>🌐 ${item.website}</p>
` : `
<p style="color:#777;">
Yhteystiedot näkyvät vain premium-yrityksille.
</p>
`}

<button
class="show-map-btn"
data-lat="${item.lat}"
data-lng="${item.lng}">
Näytä kartalla
</button>

</div>
`;

});

document.getElementById("dynamic-results").innerHTML = html;

document
.querySelectorAll(".show-map-btn")
.forEach(button => {

button.addEventListener("click", function(){

const lat =
parseFloat(this.dataset.lat);

const lng =
parseFloat(this.dataset.lng);

map.setView([lat, lng], 13);

});

});

console.log(matchingServices);

document.getElementById("search-info").textContent =
`${service} • ${country} • ${language}`;

const count = matchingServices.length;

document.getElementById("result-count").textContent =
count + " yritystä löytyi";

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: '&copy; OpenStreetMap'
}
).addTo(map);

const markers = [];

matchingServices.forEach(item => {

const marker =
L.marker([item.lat, item.lng])
.addTo(map)
.bindPopup(
`
<b>${item.premium ? '⭐ ' : ''}${item.name}</b>
<br>
${item.city}, ${item.country}
<br>
${item.address}
`
);

markers.push(marker);

});

const group = L.featureGroup(markers);

if(markers.length > 0){

    map.fitBounds(group.getBounds(), {
        padding:[100,100]
    });

}
    
document
.getElementById('show-all')
.addEventListener('click', function(){

    map.fitBounds(group.getBounds(), {
        padding:[100,100]
    });
    
    });
    
</script>

</body>
</html>
