<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehdota yritystä</title>

<style>
body{
    background:#f5f1eb;
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
}

h1{
    color:#0f172a;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input:not([type="checkbox"]),
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}


button{
    margin-top:20px;
    padding:14px 22px;
    background:#475569;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#334155;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:normal;
}

    .container{
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

    select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}
    
</style>
</head>

<body>

    <div class="container">


<h1>Ehdota yritystä</h1>

<p>
Tunnetko yrityksen, joka tarjoaa palvelua omalla kielelläsi mutta puuttuu vielä hakemistosta?

Lähetä yrityksen tiedot meille tarkistettavaksi.
</p>

<form id="suggest-form">

<label>Yrityksen nimi *</label>
<input type="text" name="companyName" required>

<label>Verkkosivu</label>
<input type="url"
       name="website"
       placeholder="Esim. https://www.yritys.fi">

<label>Maa *</label>

<select name="country" required>
    <option value="">Valitse maa</option>
    <option>Espanja</option>
    <option>Ruotsi</option>
    <option>Saksa</option>
    <option>Thaimaa</option>
    <option>Portugali</option>
    <option>Kreikka</option>
    <option>Kypros</option>
    <option>Viro</option>
    <option value="other">Muu</option>
</select>


<label>Palvelu *</label>

<select name="service" required>

    <option value="">
        Valitse palvelu
    </option>

    <option>Hammaslääkäri</option>
    <option>Lääkäri</option>
    <option>Lakimies</option>
    <option>Kiinteistönvälittäjä</option>
    <option>Personal Trainer</option>
    <option>Kahvila</option>
    <option>Ravintola</option>
    <option>Kampaaja</option>
    <option>Autovuokraamo</option>
    <option>Kirjanpitäjä</option>
    <option>Eläinlääkäri</option>
    <option>Autokorjaamo</option>
    <option>Sähköasentaja</option>
    <option>Putkimies</option>
    <option>Siivouspalvelu</option>
    <option>Lastenhoito</option>
    <option>Valokuvaaja</option>
    <option>Kauneuspalvelu</option>
    <option>IT-palvelu</option>
    <option>Kielikoulu</option>

    <option value="Muu">
        Muu palvelu
    </option>

</select>


<label>Lisätiedot</label>
<textarea
    name="notes"
    rows="6"
    placeholder="Kerro miksi ehdotat yritystä tai anna lisätietoja.">
</textarea>

    <label>Sijainti / osoite</label>

<input
    type="text"
    name="location"
    placeholder="Esim. Nørrebrogade 123, Kööpenhamina">

    <label>Millä kielellä yritys palvelee?</label>

<input
    type="text"
    name="languages"
    placeholder="Esim. Suomi, Ruotsi, Englanti">

<label>Oma sähköposti</label>
<input type="email"
       name="email"
       placeholder="Esim. oma.sahkoposti@esimerkki.fi">

<label class="checkbox-row">
    <input type="checkbox" required>
    Vakuutan tietojen olevan parhaan tietoni mukaan oikein.
</label>

<button type="submit">
Lähetä ehdotus
</button>

<p id="success-message"
   style="display:none;color:green;font-weight:bold;">

Kiitos! Yritysehdotus vastaanotettu.

Tarkistamme tiedot ennen mahdollista julkaisua.

</p>

</form>

<script>

document
.getElementById("suggest-form")
.addEventListener("submit", async function(event){

    event.preventDefault();

    const form =
        event.target;

    const formData =
        new FormData(form);

    const data = {

        action:"suggestCompany",

        companyName:
            formData.get("companyName"),

        website:
            formData.get("website"),

        country:
            formData.get("country"),

        service:
            formData.get("service"),

        notes:
            formData.get("notes"),

        email:
            formData.get("email")

    };

    try{

        const response =
            await fetch(
                "OMA_APPS_SCRIPT_URL",
                {
                    method:"POST",
                    body:JSON.stringify(data)
                }
            );

        const result =
            await response.json();

        if(result.success){

            form.reset();

            document
            .getElementById(
                "success-message"
            )
            .style.display =
                "block";

        }

    }catch(error){

        alert(
            "Lähetys epäonnistui."
        );

    }

});


</script>

</div>

</body>
</html>
