<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehdota yritystä</title>
</head>
<body>

<h1>Ehdota yritystä</h1>

<p>
Tiedätkö yrityksen, joka tarjoaa palvelua omalla kielelläsi?
Lähetä meille yrityksen tiedot, niin tarkistamme ne ennen julkaisua.
</p>

<form>

<label>Yrityksen nimi *</label><br>
<input type="text" required><br><br>

<label>Palvelu *</label><br>
<input type="text" required><br><br>

<label>Maa *</label><br>
<input type="text" required><br><br>

<label>Yrityksen verkkosivu</label><br>
<input type="url"><br><br>

<label>Yhteyshenkilön sähköposti</label><br>
<input type="email"><br><br>

<label>Lisätiedot</label><br>
<textarea rows="5"></textarea><br><br>

<button type="submit">Lähetä ehdotus</button>

</form>

</body>
</html>
