<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehdota yritystä</title>

<style>
body{
    max-width:800px;
    margin:40px auto;
    padding:20px;
    font-family:Arial,sans-serif;
}

h1{
    color:#0f172a;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    margin-top:20px;
    padding:12px 20px;
    background:#475569;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#334155;
}
</style>
</head>

<body>

<h1>Ehdota yritystä</h1>

<p>
Tiedätkö yrityksen, joka puuttuu hakemistosta?
Lähetä meille vinkki.
</p>

<form id="suggest-form">

<label>Yrityksen nimi *</label>
<input type="text" name="companyName" required>

<label>Verkkosivu</label>
<input type="url"
       name="website"
       placeholder="Esim. https://www.yritys.fi">
``

<label>Maa *</label>

<select name="country" required>
    <option value="">Valitse maa</option>
    <option>Espanja</option>
    <option>Ruotsi</option>
    <option>Saksa</option>
    <option>Thaimaa</option>
    <option>Portugali</option>
    <option>Kreikka</option>
    <option>Kypros</option>
    <option>Viro</option>
    <option value="other">Muu</option>
</select>


<label>Palvelu *</label>
<input type="text"
       name="service"
       placeholder="Esim. Hammaslääkäri"
       required>


<label>Lisätiedot</label>
<textarea
    name="notes"
    rows="6"
    placeholder="Kerro miksi ehdotat yritystä tai anna lisätietoja.">
</textarea>

<label>Oma sähköposti</label>
<input type="email"
       name="email"
       placeholder="Esim. oma.sahkoposti@esimerkki.fi">

<label style="font-weight:normal;">
    <input type="checkbox" required>
    Vakuutan tietojen olevan parhaan tietoni mukaan oikein.
</label>

<button type="submit">
Lähetä ehdotus
</button>

<p id="success-message"
   style="display:none;color:green;font-weight:bold;">

Kiitos! Yritysehdotus vastaanotettu.

Tarkistamme tiedot ennen mahdollista julkaisua.

</p>

</form>

<script>

document
.getElementById("suggest-form")
.addEventListener("submit", function(event){

    event.preventDefault();

    document
    .getElementById("success-message")
    .style.display = "block";

});

</script>

</body>
</html>
