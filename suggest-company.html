<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehdota yritystä</title>

<style>
body{
    background:#f5f1eb;
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
}

h1{
    color:#0f172a;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input:not([type="checkbox"]),
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}


button{
    margin-top:20px;
    padding:14px 22px;
    background:#475569;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#334155;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:normal;
}

    .container{
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

    select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

    .language-box{
    background:#f8fafc;
    border:1px solid #cbd5e1;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
}

.language-box .checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-weight:normal;
}

    #otherLanguageContainer{
    margin-top:10px;
}

#otherLanguageContainer input{
    width:100%;
    box-sizing:border-box;
}

    input:disabled{
    background:#f3f4f6;
    color:#6b7280;
    cursor:not-allowed;
}

    input:disabled{
    background:#f3f4f6;
    color:#6b7280;
    cursor:not-allowed;
}
    
    
</style>
</head>

<body>

    <div class="container">


<h1>Ehdota yritystä</h1>

<p>
Tunnetko yrityksen, joka tarjoaa palvelua omalla kielelläsi mutta puuttuu vielä hakemistosta?

Lähetä yrityksen tiedot meille tarkistettavaksi.
</p>

<form id="suggest-form">

<label>Yrityksen nimi *</label>
<input type="text" name="companyName" required>

<label>Verkkosivu</label>
<input type="url"
       name="website"
       placeholder="Esim. https://www.yritys.fi">

<label>Maa *</label>

<select name="country" required>
    <option value="">Valitse maa</option>
    <option>Espanja</option>
    <option>Ruotsi</option>
    <option>Saksa</option>
    <option>Thaimaa</option>
    <option>Portugali</option>
    <option>Kreikka</option>
    <option>Kypros</option>
    <option>Viro</option>
    <option value="other">Muu</option>
</select>

    <label>Kaupunki</label>
<input type="text" name="city">

<label>Toiminta-alue</label>
<input
    type="text"
    name="serviceArea"
    placeholder="Esim. Kööpenhamina, Koko Tanska">

<label>Osoite (jos tiedossa)</label>

<input
    type="text"
    id="address"
    name="address">

<label class="checkbox-row">

    <input
        type="checkbox"
        id="noAddress">

    En tiedä tarkkaa osoitetta

</label>


<label>Palvelu *</label>

<select name="service" required>

    <option value="">
        Valitse palvelu
    </option>

    <option>Hammaslääkäri</option>
    <option>Lääkäri</option>
    <option>Lakimies</option>
    <option>Kiinteistönvälittäjä</option>
    <option>Personal Trainer</option>
    <option>Kahvila</option>
    <option>Ravintola</option>
    <option>Kampaaja</option>
    <option>Autovuokraamo</option>
    <option>Kirjanpitäjä</option>
    <option>Eläinlääkäri</option>
    <option>Autokorjaamo</option>
    <option>Sähköasentaja</option>
    <option>Putkimies</option>
    <option>Siivouspalvelu</option>
    <option>Lastenhoito</option>
    <option>Valokuvaaja</option>
    <option>Kauneuspalvelu</option>
    <option>IT-palvelu</option>
    <option>Kielikoulu</option>

    <option value="Muu palvelu">
    Muu palvelu
</option>

</select>

<div id="otherServiceContainer"
     style="
        display:none;
        background:#f8fafc;
        border:1px solid #cbd5e1;
        padding:15px;
        border-radius:12px;
        margin-top:10px;
     ">

    <label>
Valitsit "Muu palvelu".
Kirjoita tähän palvelun nimi:
</label>

<input
    type="text"
    id="otherService"
    name="otherService"
    placeholder="Esim. Hieroja">

</div>


<label>Lisätiedot</label>
<textarea
    name="notes"
    rows="6"
    placeholder="Kerro miksi ehdotat yritystä tai anna lisätietoja.">
</textarea>

    <label>Palvelukielet</label>

<div class="language-box">

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Suomi">
Suomi
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Ruotsi">
Ruotsi
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Englanti">
Englanti
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Saksa">
Saksa
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Espanja">
Espanja
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Norja">
Norja
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Tanska">
Tanska
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Ranska">
Ranska
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Italia">
Italia
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Portugali">
Portugali
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Hollanti">
Hollanti
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Viro">
Viro
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Puola">
Puola
</label>

<label class="checkbox-row">
<input type="checkbox" name="languages" value="Turkki">
Turkki
</label>

<label class="checkbox-row">

    <input
        type="checkbox"
        id="otherLanguageCheckbox">

    Muu kieli

</label>

<div id="otherLanguageContainer"
     style="display:none;">

    <input
        type="text"
        name="otherLanguage"
        placeholder="Kirjoita kieli">

</div>


<label>Oma sähköposti</label>
<input type="email"
       name="email"
       placeholder="Esim. oma.sahkoposti@esimerkki.fi">

<label class="checkbox-row">
    <input type="checkbox" required>
    Vakuutan tietojen olevan parhaan tietoni mukaan oikein.
</label>

<button type="submit">
Lähetä ehdotus
</button>

<p id="success-message"
   style="display:none;color:green;font-weight:bold;">

Kiitos! Yritysehdotus vastaanotettu.

Tarkistamme tiedot ennen mahdollista julkaisua.

</p>

</form>

<script>

    const noAddressCheckbox =
    document.getElementById("noAddress");

const addressInput =
    document.getElementById("address");

noAddressCheckbox.addEventListener(
    "change",
    function(){

        if(this.checked){

            addressInput.value = "";
            addressInput.disabled = true;

        }else{

            addressInput.disabled = false;

        }

    }
);

    const serviceSelect =
    document.querySelector(
        'select[name="service"]'
    );

const otherServiceContainer =
    document.getElementById(
        "otherServiceContainer"
    );

serviceSelect.addEventListener(
    "change",
    function(){

        if(
            this.value === "Muu palvelu"
        ){

            otherServiceContainer.style.display =
                "block";

        }else{

            otherServiceContainer.style.display =
                "none";

        }

    }
);

    const otherLanguageCheckbox =
    document.getElementById(
        "otherLanguageCheckbox"
    );

const otherLanguageContainer =
    document.getElementById(
        "otherLanguageContainer"
    );

otherLanguageCheckbox.addEventListener(
    "change",
    function(){

        if(this.checked){

            otherLanguageContainer.style.display =
                "block";

        }else{

            otherLanguageContainer.style.display =
                "none";

            document.querySelector(
                '[name="otherLanguage"]'
            ).value = "";

        }

    }
);

document
.getElementById("suggest-form")
.addEventListener("submit", async function(event){

    event.preventDefault();

    const form =
        event.target;

    const formData =
        new FormData(form);

    const data = {

    action:"suggestCompany",

    companyName:
        formData.get("companyName"),

    website:
        formData.get("website"),

    country:
        formData.get("country"),

    service:
        formData.get("service") === "Muu palvelu"
            ? formData.get("otherService")
            : formData.get("service"),

    location:
        formData.get("location"),

    languages:
        formData.get("languages"),

    notes:
        formData.get("notes"),

    email:
        formData.get("email")

};

    try{

        const response =
            await fetch(
                "https://script.google.com/macros/s/AKfycbwL9rUFjX_pQe5PAk3LrWjE8QyOSG68Z1cuCmv0zLk7d6zyWB7LwIt287BLzT_AvLwEMQ/exec",
                {
                    method:"POST",
                    body:JSON.stringify(data)
                }
            );

        const result =
            await response.json();

        if(result.success){

            form.reset();

            document
            .getElementById(
                "success-message"
            )
            .style.display =
                "block";

        }

    }catch(error){

        alert(
            "Lähetys epäonnistui."
        );

    }

});


</script>

</div>

</body>
</html>
