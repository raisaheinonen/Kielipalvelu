<style>

body{

h1{

}

.company-card{
    background:white;

}

.approve-btn{

}

.reject-btn{

    .premium-admin{

.premium-admin h4{

}

.premium-admin label{

}

.premium-admin input{
    width:100%;
    max-width:350px;
    box-sizing:border-box;
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    display:block;
    background:white;
}

.premium-activate-btn{
    margin-top:16px;
    background:#475569;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.premium-activate-btn:hover{
    background:#334155;
}

.premium-save-message{
    margin-top:10px;
    font-size:14px;
    font-weight:600;
}

    .premium-deactivate-btn{
    margin-top:16px;
    margin-left:8px;
    background:white;
    color:#475569;
    border:1px solid #94a3b8;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.premium-deactivate-btn:hover{
    background:#f1f5f9;
}

    .premium-status{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    margin-left:6px;
}

.premium-status.active{
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.premium-status.inactive{
    background:#f1f5f9;
    color:#64748b;
    border:1px solid #cbd5e1;
}

    .premium-activate-btn:disabled,
.premium-deactivate-btn:disabled{
    opacity:0.55;
    cursor:not-allowed;
}

    #admin-todos{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
}

.todo-card{

    padding:6px 0;
    background:none;
    border:none;
    border-radius:0;
    font-size:14px;
    font-weight:600;
    color:#9a3412;
    cursor:pointer;
}

    .admin-layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
}

.admin-sidebar{
    width:300px;
    flex-shrink:0;

    position:sticky;
    top:20px;
    align-self:flex-start;

    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
    max-height:calc(100vh - 40px);
overflow-y:auto;
}

.admin-content{
    flex:1;
    padding-left:30px;
}

    .card-summary{
    font-size:14px;
    color:#64748b;
    font-weight:600;
    margin:8px 0 14px 0;
}

    .filter-title{
    margin:20px 0 10px;
    padding-bottom:8px;

    border-bottom:1px solid #e5e7eb;

    font-size:13px;
    font-weight:700;
    letter-spacing:1px;

    color:#64748b;
}

    #filters button,
#country-filters button,
#service-filters button{

    width:100%;
    text-align:left;
    margin-bottom:8px;
    border:none;
    background:#f8fafc;
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
}

    #filters button:hover,
#country-filters button:hover,
#service-filters button:hover{

    background:#e2e8f0;
}

    #country-select,
#service-select{

    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #d1d5db;
    margin-bottom:12px;
}

    .collapsible-filter{
    cursor:pointer;
    user-select:none;
}

    .filter-section{

    overflow:hidden;
    transition:0.3s ease;
}

    #pending-companies{
    width:100%;
}

   .edit-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.approve-btn,
.edit-btn,
.reject-btn{
    margin-top:10px;
}


</style>
</head>

<script>

document
.querySelectorAll(".collapsible-filter")
.forEach(title => {

    title.addEventListener("click", function(){

        console.log(this.textContent);

        const section =
        this.nextElementSibling;

        const arrow =
        this.querySelector(".toggle-arrow");

        if(section.style.display === "none"){

            section.style.display = "block";

            arrow.textContent = "▼";

        } else {

            section.style.display = "none";

            arrow.textContent = "▶";

        }

    });

});
    
fetch("https://script.google.com/macros/s/AKfycbwL9rUFjX_pQe5PAk3LrWjE8QyOSG68Z1cuCmv0zLk7d6zyWB7LwIt287BLzT_AvLwEMQ/exec")
.then(response => response.json())
.then(data => {

   function formatDateForInput(value){

    if(!value){
        return "";
    }

    const date = new Date(value);

    if(isNaN(date.getTime())){
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

const companies =
data.slice(1).map(row => ({

companyName: row[0],
country: row[1],
city: row[2],
service: row[3],
email: row[4],
phone: row[5],
website: row[6],
description: row[7],
status: row[8],
submittedAt: row[9],

serviceArea: row[10],
address: row[11],
mapsLink: row[12],
instagram: row[13],
facebook: row[14],
contactPerson: row[15],
languages: row[16],
otherLanguage: row[17],
otherCountry: row[18],
otherService: row[19],
latitude: row[20],
longitude: row[21],
premiumInterest: row[22],
premiumStatus: row[23],
premiumStart: row[24],
premiumEnd: row[25],
companyId: row[26],
description_fi: row[27],
description_en: row[28],
description_sv: row[29],
description_no: row[30],
description_da: row[31],
description_de: row[32],
description_es: row[33],

description_lv: row[37],

description_nl: row[39],
description_pl: row[40],
description_pt: row[41],
description_tr: row[42],
logo: row[43],

premiumContactDate: row[44],

premiumFollowupStatus: row[45]

}));

     let selectedCountry = "";
let selectedService = "";

    const container =
    document.getElementById("pending-companies");

console.log(container);

    const countryFilters =
document.getElementById("country-filters");

const serviceFilters =
document.getElementById("service-filters");

const countries =
[...new Set(
    companies.map(
        company => company.country
    )
)].sort();


    const services =
[...new Set(
    companies.map(
        company => company.service
    )
)].sort();

const allCountriesButton =
document.createElement("button");

allCountriesButton.textContent =
`Kaikki maat (${companies.length})`;

allCountriesButton.addEventListener("click", function(){

    selectedCountry = "";

    applyFilters();

});

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display = "";

});

countryFilters.appendChild(allCountriesButton);

    countries.forEach(country => {

    const button =
    document.createElement("button");

    const count =
    companies.filter(
        company => company.country === country
    ).length;

    button.textContent =
    `${country} (${count})`;

    button.addEventListener("click", function(){

    selectedCountry = country;

    applyFilters();

});

        countryFilters.appendChild(button); 

        const option =
document.createElement("option");

option.value = country;

option.textContent =
`${country} (${count})`;

});


        const allServicesButton =
document.createElement("button");

allServicesButton.textContent =
`Kaikki palvelut (${companies.length})`;

allServicesButton.addEventListener("click", function(){

    selectedService = "";

    applyFilters();

});

serviceFilters.appendChild(allServicesButton);

services.forEach(service => {

    const count =
    companies.filter(
        company => company.service === service
    ).length;

    const option =
    document.createElement("option");

    option.value = service;

    option.textContent =
    `${service} (${count})`;

    const button =
    document.createElement("button");

    button.textContent =
    `${service} (${count})`;

   button.addEventListener("click", function(){

    selectedService = service;

    applyFilters();

    });

    serviceFilters.appendChild(button);

});
    
const searchInput =
document.getElementById("search");


let pendingCount =
companies.filter(
    company =>
    (company.status || "pending") === "pending"
).length;

let approvedCount =
companies.filter(
    company =>
    company.status === "hyväksytty"
).length;

let rejectedCount =
companies.filter(
    company =>
    company.status === "hylätty"
).length;

const missingWebsiteCount =
companies.filter(
    company =>
    !company.website
).length;

const missingLogoCount =
companies.filter(
    company =>
    !company.logo
).length;

const premiumInterestCount =
companies.filter(
    company =>
    String(company.premiumInterest)
        .toLowerCase() === "true"
).length;

const missingFinnishDescriptionCount =
companies.filter(
    company =>
    !company.description_fi
).length;   


document.getElementById("all-count").textContent =
companies.length;

document.getElementById("pending-filter-count").textContent =
pendingCount;

document.getElementById("approved-filter-count").textContent =
approvedCount;

document.getElementById("rejected-filter-count").textContent =
rejectedCount;

document.getElementById("search-results").textContent =
`Näytetään ${companies.length} / ${companies.length} yritystä`;

document.getElementById("admin-todos").innerHTML = `

<div class="todo-card">
⚠ Odottaa hyväksyntää (${pendingCount})
</div>

<div class="todo-card" data-filter="missing-website">
⚠ Ei verkkosivua (${missingWebsiteCount})
</div>

<div class="todo-card" data-filter="missing-logo">
⚠ Ei logoa (${missingLogoCount})
</div>

<div class="todo-card" data-filter="missing-finnish">
⚠ Ei suomenkielistä kuvausta (${missingFinnishDescriptionCount})
</div>

<div class="todo-card" data-filter="premium-interest">
⚠ Premium kiinnostunut (${premiumInterestCount})
</div>

`;

    companies.sort((a, b) => {

    return new Date(b.submittedAt) -
           new Date(a.submittedAt);

});

   function applyFilters(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        const countryMatch =
        !selectedCountry ||
        card.dataset.search.includes(
            selectedCountry.toLowerCase()
        );

        const serviceMatch =
        !selectedService ||
        card.dataset.search.includes(
            selectedService.toLowerCase()
        );

        if(countryMatch && serviceMatch){

            card.style.display = "";

        } else {

            card.style.display = "none";

        }

    });

}

    document.getElementById("show-all")
.addEventListener("click", function(){

    document
.querySelectorAll(".todo-card")
.forEach(todo => {

    todo.addEventListener("click", function(){

        const filter =
        this.dataset.filter;

        document
        .querySelectorAll(".company-card")
        .forEach(card => {

            let show = false;

            if(
                filter === "missing-logo"
            ){
                show =
                card.dataset.logo === "no";
            }

            if(
                filter === "missing-website"
            ){
                show =
                card.dataset.website === "no";
            }

            if(
                filter === "missing-finnish"
            ){
                show =
                card.dataset.finnish === "no";
            }

            if(
                filter === "premium-interest"
            ){
                show =
                card.dataset.premiuminterest === "yes";
            }

            card.style.display =
            show ? "" : "none";

        });

    });

});

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display = "";

    });

});

document.getElementById("show-pending")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "pending"
        ? ""
        : "none";

    });

});

document.getElementById("show-approved")
.addEventListener("click", function(){

    console.log("Hyväksytyt nappi painettu");

    console.log(
document.querySelectorAll(".company-card").length
);

    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "hyväksytty"

        : "none";

    });

});

document.getElementById("show-rejected")
.addEventListener("click", function(){

    console.log("Hylätyt nappi painettu");

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "hylätty"
        ? ""
        : "none";

    });

});

    document.getElementById("show-pending")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "pending"
        ? ""
        : "none";

    });

});

document.getElementById("show-approved")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "hyväksytty"
        ? ""
        : "none";

    });

});

document.getElementById("show-rejected")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display =
        card.dataset.status === "hylätty"
        ? ""
        : "none";

    });

});

  

    companies.forEach(company => {

    const card =
    document.createElement("div");

        card.classList.add("company-card");

        card.dataset.status =
company.status || "pending";

    card.dataset.logo =
company.logo ? "yes" : "no";

card.dataset.website =
company.website ? "yes" : "no";

card.dataset.finnish =
company.description_fi ? "yes" : "no";

card.dataset.premiuminterest =
String(company.premiumInterest)

: "no";

        card.dataset.country =
company.country;

    card.dataset.search =
`${company.companyName}
 ${company.country}
 ${company.city}
 ${company.service}`.toLowerCase();

    card.dataset.country =
company.country;


        console.log(
    company.companyName,
    company.status
);

    if (company.status) {
    card.classList.add(company.status);
}

 const dateObj = new Date(company.submittedAt);

const sentDate =
isNaN(dateObj.getTime())
    ? "-"
    : dateObj.toLocaleString("fi-FI");

card.innerHTML = `

        function updatePremiumButtons(status){

    if(!premiumActivateBtn || !premiumDeactivateBtn){
        return;
    }

    if(status === "active"){

        if(premiumStatusText){
            premiumStatusText.textContent =
                "Aktiivinen";
        }

        premiumActivateBtn.disabled = true;
        premiumActivateBtn.textContent =
            "★ Premium aktiivinen";

        premiumDeactivateBtn.disabled = false;
        premiumDeactivateBtn.textContent =
            "Poista Premium käytöstä";

    } else {

        if(premiumStatusText){
            premiumStatusText.textContent =
                "Ei aktiivinen";
        }

        premiumActivateBtn.disabled = false;
        premiumActivateBtn.textContent =
            "★ Aktivoi Premium";

        premiumDeactivateBtn.disabled = true;
        premiumDeactivateBtn.textContent =
            "Premium ei ole aktiivinen";

    }

}

premiumActivateBtn.addEventListener("click", function(){

    const companyId =
        premiumCompanyId.value.trim();

    const startDate =
        premiumStart.value;

    const endDate =
        premiumEnd.value;

    if(!companyId){

        premiumSaveMessage.textContent =
            "Anna ensin Company ID.";

        premiumSaveMessage.style.color =
            "#dc2626";

        return;
    }

    if(!startDate || !endDate){

        premiumSaveMessage.textContent =
            "Valitse Premiumin alku- ja loppupäivä.";

        premiumSaveMessage.style.color =
            "#dc2626";

        return;
    }

    premiumActivateBtn.disabled = true;

    premiumSaveMessage.textContent =
        "Tallennetaan...";

    premiumSaveMessage.style.color =
        "#475569";


    fetch("https://script.google.com/macros/s/AKfycbwL9rUFjX_pQe5PAk3LrWjE8QyOSG68Z1cuCmv0zLk7d6zyWB7LwIt287BLzT_AvLwEMQ/exec", {

        method: "POST",

        body: JSON.stringify({

            action: "updatePremium",

            companyName: company.companyName,

            email: company.email,

            companyId: companyId,

            premiumStatus: "active",

            premiumStart: startDate,

            premiumEnd: endDate,

            premiumContactDate:
premiumContactDateField.value,

premiumFollowupStatus:
premiumFollowupStatusField.value


        })

    })

   .then(response => response.text())

.then(text => {

    console.log("Premium vastaus:", text);

    let data;

    try {
        data = JSON.parse(text);
    } catch(error) {
        throw new Error("Apps Script palautti virheellisen vastauksen: " + text);
    }

    return data;

})

    .then(data => {

        if(data.success){

            premiumStatusText.textContent =
                "Aktiivinen";

            premiumSaveMessage.textContent =
                "Premium aktivoitu ja tallennettu.";

            company.premiumStatus = "active";

updatePremiumButtons("active");

            premiumSaveMessage.style.color =
                "#16a34a";

        } else {

            premiumSaveMessage.textContent =
                data.message || "Tallennus epäonnistui.";

            premiumSaveMessage.style.color =
                "#dc2626";

        }

    })

    .catch(error => {

    console.error("Premium deaktivoinnin vastausvirhe:", error);

    premiumSaveMessage.textContent =
        "Premium-muutos lähetettiin. Päivitä sivu varmistaaksesi tallennuksen.";

    premiumSaveMessage.style.color =
        "#d97706";

})

    .finally(() => {

        premiumActivateBtn.disabled = false;

    });

});
