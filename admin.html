<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title> 

<style>

.approve-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.reject-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

body{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f8fafc;
}

h1{
    color:#0f172a;
}

.company-card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.approve-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.reject-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

    #stats-box{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

    #search{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
}

    #filters{
    margin-bottom:20px;
}

#filters button{
    margin-right:10px;
    padding:8px 14px;
    cursor:pointer;
}

    .details-btn{
    margin-bottom:10px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
    .pending{
    border-left:6px solid #eab308;
}

.hyväksytty{
    border-left:6px solid #16a34a;
}

.hylätty{
    border-left:6px solid #dc2626;
}

    #country-filters{
    margin-bottom:20px;
}

#country-filters button{
    margin-right:10px;
    margin-bottom:10px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

    #service-filters{
    margin-bottom:20px;
}

#service-filters button{
    margin-right:10px;
    margin-bottom:10px;
}


</style>
</head>

<body>

<h1>Yritysten hyväksyntä</h1>

<div id="stats-box">

    <h3>Yhteenveto</h3>

    <p>
        Odottaa hyväksyntää:
        <span id="pending-count">0</span>
    </p>

</div>

 <p>
    Hyväksytty:
    <span id="approved-count">0</span>
</p>

<p>
    Hylätty:
    <span id="rejected-count">0</span>
</p>


</div>

<p>
Tähän näkymään tulevat uudet yritysehdotukset ennen julkaisua.
</p>

   
</div>

<input
    type="text"
    id="search"
    placeholder="Hae yritystä, maata tai palvelua..."
    >

    <p id="search-results">
    Näytetään 0 / 0 yritystä
</p>

    <div id="filters">

    <button id="show-all">
    Kaikki (<span id="all-count">0</span>)
</button>

<button id="show-pending">
    Odottaa (<span id="pending-filter-count">0</span>)
</button>

<button id="show-approved">
    Hyväksytyt (<span id="approved-filter-count">0</span>)
</button>

<button id="show-rejected">
    Hylätyt (<span id="rejected-filter-count">0</span>)
</button>

</div>

    <div id="country-filters"></div>

    <div id="service-filters"></div>

<div id="pending-companies"></div>

<script>

fetch("pending-companies.json")
.then(response => response.json())
.then(companies => {

    const container =
    document.getElementById("pending-companies");

    const countryFilters =
document.getElementById("country-filters");

const serviceFilters =
document.getElementById("service-filters");

const countries =
[...new Set(
    companies.map(
        company => company.country
    )
)].sort();

    const services =
[...new Set(
    companies.map(
        company => company.service
    )
)].sort();

    const allCountriesButton =
document.createElement("button");

allCountriesButton.textContent =
`Kaikki maat (${companies.length})`;

allCountriesButton.addEventListener("click", function(){

    selectedCountry = "";

    applyFilters();

});

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display = "";

    });

});

countryFilters.appendChild(allCountriesButton);

    countries.forEach(country => {

    const button =
    document.createElement("button");

    const count =
    companies.filter(
        company => company.country === country
    ).length;

    button.textContent =
    `${country} (${count})`;

    button.addEventListener("click", function(){

    selectedService = service;

    applyFilters();

});

        document
        .querySelectorAll(".company-card")
        .forEach(card => {

            if(
                card.dataset.search.includes(
                    country.toLowerCase()
                )
            ){
                card.style.display = "";
            } else {
                card.style.display = "none";
            }

        });

    });

        const allServicesButton =
document.createElement("button");

allServicesButton.textContent =
`Kaikki palvelut (${companies.length})`;

allServicesButton.addEventListener("click", function(){

    selectedService = "";

    applyFilters();

});

serviceFilters.appendChild(allServicesButton);

    countryFilters.appendChild(button);

});

    services.forEach(service => {

    const button =
    document.createElement("button");

    const count =
    companies.filter(
        company => company.service === service
    ).length;

    button.textContent =
    `${service} (${count})`;

    button.addEventListener("click", function(){

        document
        .querySelectorAll(".company-card")
        .forEach(card => {

            if(
                card.dataset.search.includes(
                    service.toLowerCase()
                )
            ){
                card.style.display = "";
            } else {
                card.style.display = "none";
            }

        });

    });

    serviceFilters.appendChild(button);

});
    
const searchInput =
document.getElementById("search");


let pendingCount = companies.length;
let approvedCount = 0;
let rejectedCount = 0;

    let selectedCountry = "";
let selectedService = "";


document.getElementById("all-count").textContent =
companies.length;

document.getElementById("pending-filter-count").textContent =
pendingCount;

document.getElementById("approved-filter-count").textContent =
approvedCount;

document.getElementById("rejected-filter-count").textContent =
rejectedCount;

document.getElementById("search-results").textContent =
`Näytetään ${companies.length} / ${companies.length} yritystä`;

document.getElementById("pending-count").textContent =
pendingCount;

    companies.sort((a, b) => {

    return new Date(b.submittedAt) -
           new Date(a.submittedAt);

});

    function applyFilters(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        const countryMatch =
        !selectedCountry ||
        card.dataset.search.includes(
            selectedCountry.toLowerCase()
        );

        const serviceMatch =
        !selectedService ||
        card.dataset.search.includes(
            selectedService.toLowerCase()
        );

        if(countryMatch && serviceMatch){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

}

  

    companies.forEach(company => {

    const card =
    document.createElement("div");

    card.dataset.search =
`${company.companyName}
 ${company.country}
 ${company.city}
 ${company.service}`.toLowerCase();

        card.dataset.status =
company.status;

    card.dataset.country =
company.country;

        if(company.status !== "pending"){
    card.style.display = "none";
}

    card.classList.add("company-card");

    card.classList.add(company.status);

    card.innerHTML = `
<h3>${company.companyName}</h3>

<p>
<strong>Lähetetty:</strong>
${company.submittedAt || "-"}
</p>

<button class="details-btn">
    Näytä tiedot
</button>

<div class="details-section" style="display:none;">

<p><strong>Maa:</strong> ${company.country}</p>

<p><strong>Kaupunki:</strong> ${company.city}</p>

<p><strong>Palvelu:</strong> ${company.service}</p>

<p><strong>Sähköposti:</strong> ${company.email}</p>

<p><strong>Toiminta-alue:</strong> ${company.serviceArea || "-"}</p> 

<p><strong>Puhelin:</strong> ${company.phone || "-"}</p>

<p><strong>Verkkosivu:</strong> ${company.website || "-"}</p>

<p><strong>Instagram:</strong> ${company.instagram || "-"}</p>

<p><strong>Facebook:</strong> ${company.facebook || "-"}</p>

<p><strong>Kuvaus:</strong> ${company.description || "-"}</p>

</div>

<p class="status-row">
    <strong>Tila:</strong> ${company.status}
</p>

<button class="approve-btn">Hyväksy</button>

<button class="reject-btn">Hylkää</button>
`;


       const approveBtn =
card.querySelector(".approve-btn");

const rejectBtn =
card.querySelector(".reject-btn");

    const detailsBtn =
card.querySelector(".details-btn");

const detailsSection =
card.querySelector(".details-section");



    detailsBtn.addEventListener("click", function(){

    if(detailsSection.style.display === "none"){

        detailsSection.style.display = "block";
        detailsBtn.textContent = "Piilota tiedot";

    } else {

        detailsSection.style.display = "none";
        detailsBtn.textContent = "Näytä tiedot";

    }

});

    
approveBtn.addEventListener("click", function(){

    card.style.border = "2px solid green";

    card.querySelector(".status-row").innerHTML =
    "<strong>Tila:</strong> hyväksytty";

    card.dataset.status = "hyväksytty";

    card.classList.remove("pending");
card.classList.add("hyväksytty");

    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    approvedCount++;
    pendingCount--;

    document.getElementById("approved-filter-count").textContent =
approvedCount;

document.getElementById("pending-filter-count").textContent =
pendingCount;

    document.getElementById("approved-count").textContent =
    approvedCount;

    document.getElementById("pending-count").textContent =
    pendingCount;

});

rejectBtn.addEventListener("click", function(){

    card.style.border = "2px solid red";

    card.querySelector(".status-row").innerHTML =
    "<strong>Tila:</strong> hylätty";

    card.dataset.status = "hylätty";

    card.classList.remove("pending");
card.classList.add("hylätty");

    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    rejectedCount++;
    pendingCount--;

    document.getElementById("rejected-filter-count").textContent =
rejectedCount;

document.getElementById("pending-filter-count").textContent =
pendingCount;

    document.getElementById("rejected-count").textContent =
    rejectedCount;

    document.getElementById("pending-count").textContent =
    pendingCount;


});

container.appendChild(card);

}); 


    document
.getElementById("show-all")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display = "";

    });

});

    document
.getElementById("show-approved")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.status === "hyväksytty"){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});

   

    document
.getElementById("country-germany")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.search.includes("saksa")){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});
``



        document
.getElementById("show-rejected")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.status === "hylätty"){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});

    document
.getElementById("country-spain")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.country === "Espanja"){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});

searchInput.addEventListener("input", function(){

    const value =
    this.value.toLowerCase();

    let visibleCount = 0;

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.search.includes(value)){
            card.style.display = "";
            visibleCount++;
        } else {
            card.style.display = "none";
        }

    });



    const totalCount =
    document.querySelectorAll(".company-card").length;

    const visiblePending =
companies.filter(
    company => company.status === "pending"
).length;

document.getElementById("search-results").textContent =
`Näytetään ${visiblePending} / ${companies.length} yritystä`;


});

}); 

     

</script>

</body>
</html>
