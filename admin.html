<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

.approve-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.reject-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

    <style>

body{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f8fafc;
}

h1{
    color:#0f172a;
}

.company-card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.approve-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.reject-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

    #stats-box{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

    #search{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
}

    #filters{
    margin-bottom:20px;
}

#filters button{
    margin-right:10px;
    padding:8px 14px;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>Yritysten hyväksyntä</h1>

<div id="stats-box">

    <h3>Yhteenveto</h3>

    <p>
        Odottaa hyväksyntää:
        <span id="pending-count">0</span>
    </p>

</div>

 <p>
    Hyväksytty:
    <span id="approved-count">0</span>
</p>

<p>
    Hylätty:
    <span id="rejected-count">0</span>
</p>


</div>

<p>
Tähän näkymään tulevat uudet yritysehdotukset ennen julkaisua.
</p>

   
</div>

<input
    type="text"
    id="search"
    placeholder="Hae yritystä, maata tai palvelua..."
    >

    <p id="search-results">
    Näytetään 0 / 0 yritystä
</p>

    <div id="filters">

    <button id="show-all">
        Kaikki
    </button>

    <button id="show-pending">
        Odottaa
    </button>

    <button id="show-approved">
        Hyväksytyt
    </button>

    <button id="show-rejected">
        Hylätyt
    </button>

</div>

<div id="pending-companies"></div>

<script>

fetch("pending-companies.json")
.then(response => response.json())
.then(companies => {

    const container =
    document.getElementById("pending-companies");

const searchInput =
document.getElementById("search");


let pendingCount = companies.length;
let approvedCount = 0;
let rejectedCount = 0;

document.getElementById("search-results").textContent =
`Näytetään ${companies.length} / ${companies.length} yritystä`;

document.getElementById("pending-count").textContent =
pendingCount;

  

    companies.forEach(company => {

    const card =
    document.createElement("div");

    card.dataset.search =
`${company.companyName}
 ${company.country}
 ${company.city}
 ${company.service}`.toLowerCase();

        card.dataset.status =
company.status;

    card.classList.add("company-card");

    card.innerHTML = `
<h3>${company.companyName}</h3>

<p><strong>Maa:</strong> ${company.country}</p>

<p><strong>Kaupunki:</strong> ${company.city}</p>

<p><strong>Palvelu:</strong> ${company.service}</p>

<p><strong>Sähköposti:</strong> ${company.email}</p>

<p><strong>Toiminta-alue:</strong> ${company.serviceArea || "-"}</p> 

<p><strong>Puhelin:</strong> ${company.phone || "-"}</p>

<p><strong>Verkkosivu:</strong> ${company.website || "-"}</p>

<p><strong>Instagram:</strong> ${company.instagram || "-"}</p>

<p><strong>Facebook:</strong> ${company.facebook || "-"}</p>

<p><strong>Kuvaus:</strong> ${company.description || "-"}</p>

<p class="status-row">
    <strong>Tila:</strong> ${company.status}
</p>

<button class="approve-btn">Hyväksy</button>

<button class="reject-btn">Hylkää</button>
`;


       const approveBtn =
card.querySelector(".approve-btn");

const rejectBtn =
card.querySelector(".reject-btn");

approveBtn.addEventListener("click", function(){

    card.style.border = "2px solid green";

    card.querySelector(".status-row").innerHTML =
    "<strong>Tila:</strong> hyväksytty";

    card.dataset.status = "hyväksytty";

    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    approvedCount++;
    pendingCount--;

    document.getElementById("approved-count").textContent =
    approvedCount;

    document.getElementById("pending-count").textContent =
    pendingCount;

});

rejectBtn.addEventListener("click", function(){

    card.style.border = "2px solid red";

    card.querySelector(".status-row").innerHTML =
    "<strong>Tila:</strong> hylätty";

    card.dataset.status = "hylätty";


    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    rejectedCount++;
    pendingCount--;

    document.getElementById("rejected-count").textContent =
    rejectedCount;

    document.getElementById("pending-count").textContent =
    pendingCount;


});

container.appendChild(card);

}); 


    document
.getElementById("show-all")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        card.style.display = "";

    });

});

    document
.getElementById("show-approved")
.addEventListener("click", function(){

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.status === "hyväksytty"){
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });

});

searchInput.addEventListener("input", function(){

    const value =
    this.value.toLowerCase();

    let visibleCount = 0;

    document
    .querySelectorAll(".company-card")
    .forEach(card => {

        if(card.dataset.search.includes(value)){
            card.style.display = "";
            visibleCount++;
        } else {
            card.style.display = "none";
        }

    });

    const totalCount =
    document.querySelectorAll(".company-card").length;

    document.getElementById("search-results").textContent =
    `Näytetään ${visibleCount} / ${totalCount} yritystä`;

});

}); 

     

</script>

</body>
</html>
